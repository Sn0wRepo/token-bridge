<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --panel: #151922; --panel-2: #1b2030; --line: #262d3d;
    --text: #e8ecf3; --muted: #8a93a6; --accent: #f5c542; --accent-ink: #1a1405;
    --ok: #4ade80; --bad: #f87171; --info: #60a5fa; --radius: 10px;
    --pixel: 'Silkscreen', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background-image: radial-gradient(circle at 1px 1px, #1c2130 1px, transparent 0);
    background-size: 16px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-family: var(--pixel); font-weight: 400; font-size: clamp(26px, 6vw, 36px); margin: 0; }
  h1 span { color: var(--accent); }
  .banner {
    border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent);
    border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .card + .card { margin-top: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .field { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .field + .field, .field + .swap + .field { margin-top: 0; }
  .net-row { display: flex; gap: 8px; align-items: center; }
  select, input[type=text] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: 14px system-ui, sans-serif; outline: none;
  }
  input[type=text] { font-family: var(--mono); }
  select:focus, input[type=text]:focus { border-color: var(--accent); }
  .swap { display: flex; justify-content: center; margin: -6px 0; position: relative; z-index: 1; }
  .swap button {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--accent); cursor: pointer; font-size: 18px; line-height: 1;
  }
  .amount-row { display: flex; gap: 8px; margin-top: 10px; }
  .amount-row input { font-size: 20px; flex: 1; min-width: 0; }
  .amount-row select { width: auto; flex: 0 0 auto; }
  .hint { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .section { margin-top: 16px; }
  .summary { margin-top: 16px; font-size: 14px; }
  .summary div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .summary span:first-child { color: var(--muted); }
  .summary b { font-weight: 600; }
  button.btn {
    width: 100%; margin-top: 16px; font-family: var(--pixel); font-size: 15px; padding: 14px 18px; border-radius: var(--radius);
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.btn.ghost { width: auto; margin: 0; font-size: 12px; padding: 9px 14px; background: transparent; color: var(--accent); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  .error { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  h2 { font-family: var(--pixel); font-weight: 400; font-size: 16px; margin: 0 0 14px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .steps li:first-child { border-top: 0; }
  .dot { flex: 0 0 14px; height: 14px; margin-top: 4px; border: 2px solid var(--line); background: var(--bg); }
  .steps li[data-state="active"] .dot { border-color: var(--info); background: var(--info); }
  .steps li[data-state="done"] .dot { border-color: var(--ok); background: var(--ok); }
  .steps li[data-state="failed"] .dot { border-color: var(--bad); background: var(--bad); }
  .steps .t { font-size: 14px; }
  .steps .d { font-size: 12px; color: var(--muted); word-break: break-all; }
  .steps a { color: var(--accent); }
  .history { font-size: 13px; }
  .history .item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .history .item:first-child { border-top: 0; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
  .empty { color: var(--muted); font-size: 13px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Token <span>Bridge</span></h1>
    <button class="btn ghost" id="connectBtn">Connect wallet</button>
  </header>

  <div class="banner" id="demoBanner" hidden></div>

  <div class="card">
    <div class="field">
      <label for="fromSel">From</label>
      <div class="net-row"><select id="fromSel"></select></div>
      <div class="amount-row">
        <input type="text" id="amountInput" inputmode="decimal" placeholder="0.0" autocomplete="off">
        <select id="assetSel"></select>
      </div>
      <div class="hint"><span id="balanceText">Balance: connect wallet</span><button class="link" id="maxBtn">Max</button></div>
    </div>

    <div class="swap"><button id="flipBtn" title="Swap direction" aria-label="Swap direction">&#8645;</button></div>

    <div class="field">
      <label for="toSel">To</label>
      <div class="net-row"><select id="toSel"></select></div>
      <div class="section">
        <label for="recipientInput" id="recipientLabel">Recipient</label>
        <input type="text" id="recipientInput" placeholder="0x..." autocomplete="off" spellcheck="false">
        <div class="hint"><span id="recipientHint"></span><button class="link" id="phantomBtn" hidden>Use Phantom</button></div>
      </div>
    </div>

    <div class="summary">
      <div><span>Bridge fee</span><b id="feeText">-</b></div>
      <div><span>You receive</span><b id="receiveText">-</b></div>
      <div><span>Route</span><b id="routeText">-</b></div>
    </div>

    <button class="btn" id="bridgeBtn" disabled>Enter an amount</button>
    <div class="error" id="errorText"></div>
  </div>

  <div class="card" id="progressCard" hidden>
    <h2>Transfer</h2>
    <ol class="steps" id="steps"></ol>
  </div>

  <div class="card">
    <h2>Recent transfers</h2>
    <div class="history" id="history"></div>
  </div>

  <footer>Placeholder UI for <code>contracts/BridgeVault.sol</code>. Not audited, do not use with real funds.</footer>
</div>

<script>
(() => {
  'use strict';

  // ======================================================================
  // CONFIG — fill in vault addresses after deploying BridgeVault.sol.
  // Any EVM chain with an empty `vault` runs in DEMO mode (nothing is sent).
  // ======================================================================
  const CONFIG = {
    chains: {
      ethereum: {
        name: 'Ethereum', kind: 'evm', chainId: 1, vault: '',
        explorer: 'https://etherscan.io/tx/',
        params: null, // built into every wallet
      },
      base: {
        name: 'Base', kind: 'evm', chainId: 8453, vault: '',
        explorer: 'https://basescan.org/tx/',
        params: {
          chainName: 'Base', rpcUrls: ['https://mainnet.base.org'],
          nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
          blockExplorerUrls: ['https://basescan.org'],
        },
      },
      solana: {
        // Destination id the relayer uses for Solana. Must match vault.setDestination(id, true).
        name: 'Solana', kind: 'solana', chainId: 1399811149, vault: '',
        explorer: 'https://solscan.io/tx/',
      },
    },
    routes: [
      ['ethereum', 'base'],
      ['base', 'ethereum'],
      ['ethereum', 'solana'],
      ['base', 'solana'],
    ],
    assets: {
      ETH: { symbol: 'ETH', decimals: 18, native: true },
      // Example ERC-20. Set per-chain addresses (and mark wrapped tokens in the vault with setToken).
      // USDC: { symbol: 'USDC', decimals: 6, address: { ethereum: '0x...', base: '0x...' } },
    },
    feeBps: 10,           // fallback if the vault can't be read (0.10%)
    demoDelayMs: 1800,    // per-step delay in demo mode
  };

  // ---- keccak256 (Ethereum flavour, pre-NIST padding). Dependency-free. ----
  const keccak256 = (() => {
    const M = (1n << 64n) - 1n;
    const RC = [
      0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
      0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
      0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
      0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
      0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
      0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
    ];
    const ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
    const rotl = (v, n) => (n === 0 ? v : ((v << BigInt(n)) | (v >> BigInt(64 - n))) & M);
    function permute(s) {
      const C = new Array(5), B = new Array(25);
      for (let r = 0; r < 24; r++) {
        for (let x = 0; x < 5; x++) C[x] = s[x] ^ s[x + 5] ^ s[x + 10] ^ s[x + 15] ^ s[x + 20];
        for (let x = 0; x < 5; x++) {
          const d = C[(x + 4) % 5] ^ rotl(C[(x + 1) % 5], 1);
          for (let y = 0; y < 25; y += 5) s[x + y] ^= d;
        }
        for (let x = 0; x < 5; x++)
          for (let y = 0; y < 5; y++) B[y + 5 * ((2 * x + 3 * y) % 5)] = rotl(s[x + 5 * y], ROT[x + 5 * y]);
        for (let y = 0; y < 25; y += 5)
          for (let x = 0; x < 5; x++) s[x + y] = B[x + y] ^ (~B[((x + 1) % 5) + y] & M & B[((x + 2) % 5) + y]);
        s[0] ^= RC[r];
      }
    }
    return (input) => {
      const data = typeof input === 'string' ? new TextEncoder().encode(input) : input;
      const rate = 136, len = data.length + 1, padded = new Uint8Array(Math.ceil(len / rate) * rate);
      padded.set(data); padded[data.length] = 0x01; padded[padded.length - 1] |= 0x80;
      const s = new Array(25).fill(0n);
      for (let off = 0; off < padded.length; off += rate) {
        for (let i = 0; i < rate / 8; i++) {
          let lane = 0n;
          for (let b = 7; b >= 0; b--) lane = (lane << 8n) | BigInt(padded[off + i * 8 + b]);
          s[i] ^= lane;
        }
        permute(s);
      }
      const out = new Uint8Array(32);
      for (let i = 0; i < 4; i++) { let lane = s[i]; for (let b = 0; b < 8; b++) { out[i * 8 + b] = Number(lane & 0xffn); lane >>= 8n; } }
      return out;
    };
  })();
  const toHex = (bytes) => '0x' + Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

  // ---- encoding helpers ----
  const selector = (sig) => toHex(keccak256(sig)).slice(0, 10);
  const word = (v) => (typeof v === 'bigint' ? v.toString(16) : String(v).replace(/^0x/, '')).padStart(64, '0');
  const isEvmAddress = (s) => /^0x[0-9a-fA-F]{40}$/.test(s);

  const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  /** Base58 -> bytes. Returns null on bad input. Solana pubkeys decode to exactly 32 bytes. */
  function base58Decode(str) {
    if (!/^[1-9A-HJ-NP-Za-km-z]+$/.test(str)) return null;
    let n = 0n;
    for (const c of str) n = n * 58n + BigInt(B58.indexOf(c));
    const bytes = [];
    while (n > 0n) { bytes.unshift(Number(n & 0xffn)); n >>= 8n; }
    for (const c of str) { if (c === '1') bytes.unshift(0); else break; }
    return new Uint8Array(bytes);
  }

  function parseUnits(text, decimals) {
    const m = /^(\d*)(?:\.(\d*))?$/.exec(text.trim());
    if (!m || (m[1] === '' && (m[2] === undefined || m[2] === ''))) return null;
    const frac = (m[2] || '');
    if (frac.length > decimals) return null;
    return BigInt((m[1] || '0') + frac.padEnd(decimals, '0'));
  }
  function formatUnits(value, decimals, maxFrac = 6) {
    const s = value.toString().padStart(decimals + 1, '0');
    const int = s.slice(0, s.length - decimals);
    const frac = s.slice(s.length - decimals).slice(0, maxFrac).replace(/0+$/, '');
    return frac ? `${int}.${frac}` : int;
  }
  const short = (h) => `${h.slice(0, 8)}…${h.slice(-6)}`;

  // ======================================================================
  // State + UI
  // ======================================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const state = { account: null, walletChain: null, balance: null, feeBps: CONFIG.feeBps, busy: false };
  const chainKeys = Object.keys(CONFIG.chains);
  const sources = [...new Set(CONFIG.routes.map((r) => r[0]))];

  const from = () => CONFIG.chains[$('fromSel').value];
  const to = () => CONFIG.chains[$('toSel').value];
  const asset = () => CONFIG.assets[$('assetSel').value];
  const isDemo = () => !isEvmAddress(from().vault || '');

  function fillSelect(sel, keys, keep) {
    sel.innerHTML = keys.map((k) => `<option value="${k}">${esc(CONFIG.chains[k].name)}</option>`).join('');
    if (keys.includes(keep)) sel.value = keep;
  }

  function refreshRoutes(keepTo) {
    const dests = CONFIG.routes.filter((r) => r[0] === $('fromSel').value).map((r) => r[1]);
    fillSelect($('toSel'), dests, keepTo);
    const assets = Object.keys(CONFIG.assets).filter((k) => CONFIG.assets[k].native || (CONFIG.assets[k].address || {})[$('fromSel').value]);
    const prev = $('assetSel').value;
    $('assetSel').innerHTML = assets.map((k) => `<option value="${k}">${esc(CONFIG.assets[k].symbol)}</option>`).join('');
    if (assets.includes(prev)) $('assetSel').value = prev;
    $('flipBtn').disabled = !CONFIG.routes.some((r) => r[0] === $('toSel').value && r[1] === $('fromSel').value);
    refreshRecipient();
    refreshDemoBanner();
    readVault();
    readBalance();
    update();
  }

  function refreshDemoBanner() {
    const b = $('demoBanner');
    b.hidden = !isDemo();
    b.textContent = `Demo mode: no BridgeVault configured on ${from().name}. Transfers are simulated and nothing is sent on-chain.`;
  }

  function refreshRecipient() {
    const solana = to().kind === 'solana';
    $('recipientLabel').textContent = `Recipient on ${to().name}`;
    $('recipientInput').placeholder = solana ? 'Solana address (base58)' : '0x...';
    $('phantomBtn').hidden = !solana;
    const v = $('recipientInput').value.trim();
    if (!solana && state.account && (!v || isEvmAddress(v))) $('recipientInput').value = state.account;
    if (solana && isEvmAddress(v)) $('recipientInput').value = '';
    $('recipientHint').textContent = solana ? 'Paste a Solana wallet or connect Phantom.' : 'Defaults to your connected wallet.';
  }

  /** Recipient -> bytes32 hex (no 0x) or null. */
  function recipientBytes32() {
    const v = $('recipientInput').value.trim();
    if (to().kind === 'solana') {
      const b = base58Decode(v);
      return b && b.length === 32 ? toHex(b).slice(2) : null;
    }
    return isEvmAddress(v) ? word(v.toLowerCase()) : null;
  }

  function update() {
    const a = asset();
    const err = $('errorText');
    const btn = $('bridgeBtn');
    err.textContent = '';
    $('routeText').textContent = `${from().name} → ${to().name}`;
    const amount = a ? parseUnits($('amountInput').value || '', a.decimals) : null;
    if (!amount) {
      $('feeText').textContent = '-'; $('receiveText').textContent = '-';
      btn.disabled = true; btn.textContent = 'Enter an amount';
      if ($('amountInput').value.trim()) err.textContent = 'Invalid amount.';
      return;
    }
    const fee = (amount * BigInt(state.feeBps)) / 10000n;
    $('feeText').textContent = `${formatUnits(fee, a.decimals)} ${a.symbol} (${(state.feeBps / 100).toFixed(2)}%)`;
    $('receiveText').textContent = `${formatUnits(amount - fee, a.decimals)} ${a.symbol} on ${to().name}`;

    const check = () => {
      if (state.busy) return 'Bridging…';
      if (!isDemo() && !state.account) return 'Connect wallet';
      if (!recipientBytes32()) return to().kind === 'solana' ? 'Enter a Solana address' : 'Enter a recipient';
      if (!isDemo() && state.balance !== null && a.native && amount > state.balance) return `Insufficient ${a.symbol}`;
      return null;
    };
    const problem = check();
    btn.disabled = !!problem && problem !== 'Connect wallet';
    btn.textContent = problem || (isDemo() ? `Bridge (demo) to ${to().name}` : `Bridge to ${to().name}`);
  }

  // ======================================================================
  // Wallet (EIP-1193)
  // ======================================================================
  const eth = () => window.ethereum;
  const rpc = (method, params = []) => eth().request({ method, params });

  async function connect() {
    if (!eth()) { $('errorText').textContent = 'No EVM wallet detected.'; return; }
    try {
      const [acc] = await rpc('eth_requestAccounts');
      state.account = acc;
      state.walletChain = parseInt(await rpc('eth_chainId'), 16);
      $('connectBtn').textContent = `${acc.slice(0, 6)}…${acc.slice(-4)}`;
      refreshRecipient();
      await readBalance();
      update();
    } catch (e) {
      $('errorText').textContent = e && e.code === 4001 ? 'Connection rejected.' : 'Could not connect.';
    }
  }

  async function ensureChain(chain) {
    const current = parseInt(await rpc('eth_chainId'), 16);
    if (current === chain.chainId) return;
    const hexId = '0x' + chain.chainId.toString(16);
    try {
      await rpc('wallet_switchEthereumChain', [{ chainId: hexId }]);
    } catch (e) {
      if (e && e.code === 4902 && chain.params) await rpc('wallet_addEthereumChain', [{ chainId: hexId, ...chain.params }]);
      else throw e;
    }
    state.walletChain = chain.chainId;
  }

  async function readBalance() {
    state.balance = null;
    const a = asset();
    if (!state.account || !eth() || !a) { $('balanceText').textContent = 'Balance: connect wallet'; return; }
    try {
      const chain = parseInt(await rpc('eth_chainId'), 16);
      if (chain !== from().chainId) { $('balanceText').textContent = `Balance: switch to ${from().name}`; return; }
      if (a.native) {
        state.balance = BigInt(await rpc('eth_getBalance', [state.account, 'latest']));
      } else {
        const data = selector('balanceOf(address)') + word(state.account.toLowerCase());
        state.balance = BigInt(await rpc('eth_call', [{ to: a.address[$('fromSel').value], data }, 'latest']));
      }
      $('balanceText').textContent = `Balance: ${formatUnits(state.balance, a.decimals)} ${a.symbol}`;
    } catch {
      $('balanceText').textContent = 'Balance: unavailable';
    }
  }

  async function readVault() {
    state.feeBps = CONFIG.feeBps;
    if (isDemo() || !eth()) return;
    try {
      const chain = parseInt(await rpc('eth_chainId'), 16);
      if (chain !== from().chainId) return;
      const res = await rpc('eth_call', [{ to: from().vault, data: selector('feeBps()') }, 'latest']);
      state.feeBps = Number(BigInt(res));
      update();
    } catch { /* keep fallback */ }
  }

  async function waitReceipt(hash) {
    for (;;) {
      const r = await rpc('eth_getTransactionReceipt', [hash]);
      if (r) return r;
      await new Promise((res) => setTimeout(res, 2500));
    }
  }

  // ======================================================================
  // Progress + history
  // ======================================================================
  const STEPS = (src, dst) => [
    { t: `Approve token on ${src}`, id: 'approve' },
    { t: `Lock on ${src}`, id: 'lock' },
    { t: 'Relayer picks up the transfer', id: 'relay' },
    { t: `Release on ${dst}`, id: 'release' },
  ];
  function renderSteps(list) {
    $('progressCard').hidden = false;
    $('steps').innerHTML = list.map((s) => `<li data-step="${s.id}"><span class="dot"></span><div><div class="t">${esc(s.t)}</div><div class="d"></div></div></li>`).join('');
  }
  function setStep(id, stateName, detail) {
    const li = $('steps').querySelector(`[data-step="${id}"]`);
    if (!li) return;
    li.dataset.state = stateName;
    if (detail !== undefined) li.querySelector('.d').innerHTML = detail;
  }
  const txLink = (chain, hash, demo) => demo ? `${short(hash)} <span class="tag">demo</span>` : `<a href="${esc(chain.explorer + hash)}" target="_blank" rel="noopener">${short(hash)}</a>`;

  const HISTORY_KEY = 'bridge.history.v1';
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
  function pushHistory(item) {
    const list = [item, ...loadHistory()].slice(0, 10);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch { /* storage off */ }
    renderHistory();
  }
  function renderHistory() {
    const list = loadHistory();
    $('history').innerHTML = list.length
      ? list.map((h) => `<div class="item"><span>${esc(h.amount)} ${esc(h.symbol)} · ${esc(h.from)} → ${esc(h.to)}${h.demo ? '<span class="tag">demo</span>' : ''}</span><span class="d">${esc(new Date(h.at).toLocaleString('en-US'))}</span></div>`).join('')
      : '<div class="empty">No transfers yet.</div>';
  }

  // ======================================================================
  // Bridge
  // ======================================================================
  const randomHash = () => toHex(crypto.getRandomValues(new Uint8Array(32)));
  /** Demo-only: Solana tx signatures are 64 random bytes in base58. */
  const randomSolanaSig = () => {
    let n = BigInt(toHex(crypto.getRandomValues(new Uint8Array(64)))), out = '';
    while (n > 0n) { out = B58[Number(n % 58n)] + out; n /= 58n; }
    return out;
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function runDemo(ctx) {
    renderSteps(STEPS(ctx.src.name, ctx.dst.name).filter((s) => s.id !== 'approve' || !ctx.asset.native));
    const d = CONFIG.demoDelayMs;
    if (!ctx.asset.native) { setStep('approve', 'active', 'Waiting for signature…'); await sleep(d); setStep('approve', 'done', txLink(ctx.src, randomHash(), true)); }
    setStep('lock', 'active', 'Waiting for signature…'); await sleep(d);
    setStep('lock', 'done', `${txLink(ctx.src, randomHash(), true)} · nonce #${Math.floor(Math.random() * 1000)}`);
    setStep('relay', 'active', 'Waiting for source finality…'); await sleep(d * 1.5);
    setStep('relay', 'done', 'Attested');
    setStep('release', 'active', 'Submitting…'); await sleep(d);
    setStep('release', 'done', `${txLink(ctx.dst, ctx.dst.kind === 'solana' ? randomSolanaSig() : randomHash(), true)} · ${esc(ctx.netText)}`);
  }

  async function runLive(ctx) {
    await ensureChain(ctx.src);
    const vault = ctx.src.vault;
    renderSteps(STEPS(ctx.src.name, ctx.dst.name).filter((s) => s.id !== 'approve' || !ctx.asset.native));

    let tx;
    if (ctx.asset.native) {
      setStep('lock', 'active', 'Confirm in your wallet…');
      const data = selector('bridgeNative(uint256,bytes32)') + word(BigInt(ctx.dst.chainId)) + ctx.recipient;
      tx = await rpc('eth_sendTransaction', [{ from: state.account, to: vault, value: '0x' + ctx.amount.toString(16), data }]);
    } else {
      const token = ctx.asset.address[ctx.srcKey];
      const allowanceData = selector('allowance(address,address)') + word(state.account.toLowerCase()) + word(vault.toLowerCase());
      const allowance = BigInt(await rpc('eth_call', [{ to: token, data: allowanceData }, 'latest']));
      if (allowance < ctx.amount) {
        setStep('approve', 'active', 'Confirm in your wallet…');
        const approveTx = await rpc('eth_sendTransaction', [{ from: state.account, to: token, data: selector('approve(address,uint256)') + word(vault.toLowerCase()) + word(ctx.amount) }]);
        setStep('approve', 'active', `Pending ${txLink(ctx.src, approveTx)}`);
        const r = await waitReceipt(approveTx);
        if (r.status !== '0x1') throw new Error('Approve reverted');
        setStep('approve', 'done', txLink(ctx.src, approveTx));
      } else {
        setStep('approve', 'done', 'Allowance already set');
      }
      setStep('lock', 'active', 'Confirm in your wallet…');
      const data = selector('bridgeERC20(address,uint256,uint256,bytes32)') + word(token.toLowerCase()) + word(ctx.amount) + word(BigInt(ctx.dst.chainId)) + ctx.recipient;
      tx = await rpc('eth_sendTransaction', [{ from: state.account, to: vault, data }]);
    }

    setStep('lock', 'active', `Pending ${txLink(ctx.src, tx)}`);
    const receipt = await waitReceipt(tx);
    if (receipt.status !== '0x1') { setStep('lock', 'failed', `Reverted ${txLink(ctx.src, tx)}`); throw new Error('Bridge transaction reverted'); }

    // BridgeRequested(uint256 indexed nonce, address indexed sender, address indexed token, ...)
    const topic = toHex(keccak256('BridgeRequested(uint256,address,address,uint256,uint256,uint256,bytes32)'));
    const log = receipt.logs.find((l) => l.address.toLowerCase() === vault.toLowerCase() && l.topics[0] === topic);
    const nonce = log ? BigInt(log.topics[1]) : null;
    setStep('lock', 'done', `${txLink(ctx.src, tx)}${nonce !== null ? ` · nonce #${nonce}` : ''}`);
    setStep('relay', 'active', `Waiting for the relayer. Transfer id: srcChain ${ctx.src.chainId}, nonce ${nonce ?? '?'}`);
    setStep('release', '', `Funds arrive on ${esc(ctx.dst.name)} once the relayer calls release().`);
  }

  async function bridge() {
    if (!isDemo() && !state.account) return connect();
    const a = asset();
    const amount = parseUnits($('amountInput').value, a.decimals);
    const recipient = recipientBytes32();
    if (!amount || !recipient) return;
    const fee = (amount * BigInt(state.feeBps)) / 10000n;
    const ctx = {
      srcKey: $('fromSel').value, src: from(), dst: to(), asset: a, amount, recipient,
      netText: `${formatUnits(amount - fee, a.decimals)} ${a.symbol}`,
    };
    const demo = isDemo();
    state.busy = true; update();
    try {
      if (demo) await runDemo(ctx); else await runLive(ctx);
      pushHistory({ amount: formatUnits(amount, a.decimals), symbol: a.symbol, from: ctx.src.name, to: ctx.dst.name, demo, at: Date.now() });
      $('amountInput').value = '';
    } catch (e) {
      $('errorText').textContent = e && e.code === 4001 ? 'Transaction rejected.' : (e && e.message) || 'Bridge failed.';
      $('steps').querySelectorAll('[data-state="active"]').forEach((li) => (li.dataset.state = 'failed'));
    } finally {
      state.busy = false; update(); readBalance();
    }
  }

  // ---- Phantom (Solana) helper ----
  async function usePhantom() {
    const p = (window.phantom && window.phantom.solana) || window.solana;
    if (!p) { $('recipientHint').textContent = 'Phantom not detected. Paste the address instead.'; return; }
    try {
      const res = await p.connect();
      $('recipientInput').value = res.publicKey.toString();
      update();
    } catch { $('recipientHint').textContent = 'Phantom connection rejected.'; }
  }

  // ---- wiring ----
  fillSelect($('fromSel'), sources.filter((k) => chainKeys.includes(k)), 'ethereum');
  $('fromSel').onchange = () => refreshRoutes($('toSel').value);
  $('toSel').onchange = () => { $('flipBtn').disabled = !CONFIG.routes.some((r) => r[0] === $('toSel').value && r[1] === $('fromSel').value); refreshRecipient(); update(); };
  $('assetSel').onchange = () => { readBalance().then(update); };
  $('amountInput').addEventListener('input', update);
  $('recipientInput').addEventListener('input', update);
  $('flipBtn').onclick = () => { const f = $('fromSel').value; $('fromSel').value = $('toSel').value; refreshRoutes(f); };
  $('maxBtn').onclick = () => { if (state.balance !== null) { $('amountInput').value = formatUnits(state.balance, asset().decimals, asset().decimals); update(); } };
  $('connectBtn').onclick = connect;
  $('bridgeBtn').onclick = bridge;
  $('phantomBtn').onclick = usePhantom;
  if (eth() && eth().on) {
    eth().on('accountsChanged', (accs) => { state.account = accs[0] || null; refreshRecipient(); readBalance().then(update); });
    eth().on('chainChanged', () => { readBalance().then(update); readVault(); });
  }

  refreshRoutes('base');
  renderHistory();
})();
</script>
</body>
</html>
