# Copy to relayer.toml and fill in. The signing key is read from RELAYER_PRIVATE_KEY, never from this file.

state_file = "relayer-state.json"
poll_interval_secs = 12

[[chains]]
name = "ethereum"
chain_id = 1
rpc_url = "https://ethereum-rpc.publicnode.com"
vault = "0x1111111111111111111111111111111111111111"   # BridgeVault on Ethereum
confirmations = 12
start_block = 0                                         # vault deployment block
max_block_range = 2000

[[chains]]
name = "base"
chain_id = 8453
rpc_url = "https://mainnet.base.org"
vault = "0x2222222222222222222222222222222222222222"   # BridgeVault on Base
confirmations = 10
start_block = 0
max_block_range = 2000

# Solana is destination-only here: jobs are appended to a JSONL outbox that a Solana-side executor consumes.
[solana]
chain_id = 1399811149                                   # must match vault.setDestination(id, true)
outbox = "solana-outbox.jsonl"

