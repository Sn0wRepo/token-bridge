[package]
name = "bridge-relayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Reference relayer for BridgeVault.sol: watches BridgeRequested events and submits release() on the destination chain"
license = "MIT"
readme = "../README.md"
keywords = ["bridge", "relayer", "ethereum", "base", "solana"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "bridge-relayer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
